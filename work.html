<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reet — Work (grid)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; background: var(--bg); font-family: 'Switzer', sans-serif;
    color: #141414; overflow: hidden;
  }

  /* ── Grid area ──
     Inset a little from the header/edges so the 6-section area reads as
     slightly smaller than before, per request ("just a little less"). */
  #grid-wrap {
    position: fixed;
    top: var(--header-h);
    left: 2.5%; right: 2.5%; bottom: 10%;
    background: var(--bg);   /* needed so the thumbnails' white blends into the page colour */
  }

  /* Link row at the bottom, in exactly the same place as on the home page.
     The home page puts it 4% up from the bottom of its 1600x1020 canvas,
     so the same maths is used here. */
  #work-links {
    position: fixed; left: 0; right: 0; z-index: 20;
    bottom: calc(min(100vw * 1020 / 1600, 100vh) * 0.04);
  }

  #grid-cells {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }

  .cell {
    display: flex; align-items: center; justify-content: center;
    position: relative;
    container-type: inline-size;   /* lets the labels size themselves to this cell's width */
    text-decoration: none;
    color: inherit;
  }

  /* ---------- the cutout / photo / placeholder ----------
     No image yet -> a plain grey circle placeholder (just a generic
     stand-in, not a design statement). Once an image is set, it's shown
     at its own actual shape -- no circular mask, no cropping -- since
     every project's cutout will be a different silhouette.

     Sizing was bumped up across the board here (max-width/max-height on
     .visual, plus the vh caps below) since all six images are now real
     files and the old caps were leaving them looking small. */
  .visual {
    display: flex; align-items: center; justify-content: center;
    mix-blend-mode: multiply;   /* white areas in the thumbnail files take on the page colour */
    max-width: 72%; max-height: 62%;
    transition: transform 0.32s cubic-bezier(.2,.8,.2,1), filter 0.35s ease;
  }
  .cell:hover .visual { transform: translateY(-14px) scale(1.04); }

  /* subtle blur applied via JS to every OTHER cell's visual while one is hovered */
  .visual.blurred { filter: blur(3px); }

  .visual .placeholder-shape {
    width: 150px; height: 150px;
    border-radius: 50%;
    background: #ececec;
  }

  .visual img {
    display: block;
    max-width: 100%;
    max-height: 38vh; /* fallback if a project doesn't set its own sizeVh -- see PROJECTS below */
    width: auto;
    height: auto;
    object-fit: contain;
  }

  /* ---------- hover-only labels ----------
     Title on the left, tags on the right (smaller, lighter, no box).
     Top row: the labels sit along the top of the cell.
     Bottom row: the labels sit along the bottom of the cell. */
  .label-bar {
    position: absolute; left: 7%; right: 7%;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  /* The labels line up with the ends of the vertical grid lines:
     bottom row -> text's bottom edge sits level with the bottom of the
     lower end circles; top row -> text's top edge level with the top of
     the upper end circles. Both numbers come from --grid-v-margin and
     --pin-r (see :root), which the lines script also reads, so the two
     always stay in sync. */
  .cell.row-top .label-bar    { top: calc(var(--grid-v-margin) - var(--pin-r));    transform: translateY(-6px); }
  .cell.row-bottom .label-bar { bottom: calc(var(--grid-v-margin) - var(--pin-r)); transform: translateY(6px); }
  .label-bar .name, .label-bar .tag { line-height: 1; }
  .cell:hover .label-bar { opacity: 1; transform: translateY(0); }

  /* Label sizes are tied to the cell's own width (cqi = 1% of the cell),
     so title + tags always fit inside their section. If a long pair
     still can't fit on one line, the tags wrap onto a second line
     (right-aligned) instead of spilling past the grid lines. */
  .name {
    font-size: clamp(12.5px, 3.05cqi, 16px);
    font-weight: 500;
    color: #141414;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tag {
    font-size: clamp(10.5px, 2.45cqi, 13px);
    font-weight: 400;
    color: #a3a3a3;
    letter-spacing: 0.02em;
    text-align: right;
    min-width: 0;
  }

  #grid-lines {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #grid-lines svg { width: 100%; height: 100%; overflow: visible; }
  /* stroke-width is fixed here and never overridden on hover anymore --
     only the colour (set via JS) changes now, size stays constant */
  #grid-lines path { fill: none; stroke: #bdbdbd; stroke-width: 2.7; stroke-linecap: round; transition: stroke 0.25s ease; }
  #grid-lines circle { fill: #bdbdbd; transition: fill 0.25s ease; }

  @media (max-width: 780px){
    .visual { width: 34%; }
    .tag { font-size: 11px; }
    .name { font-size: 13px; }
  }

  /* ===== Site-wide: name block (top left) + link row, same as the home page =====
     These values match index.html exactly -- no work-page-only scaling --
     so nothing shifts or grows when moving between pages. */
  :root {
    --grid-v-margin: 36px;   /* gap between the vertical grid lines' ends and the grid's top/bottom (was 56px -- lines are now longer) */
    --pin-r: 4.2px;          /* radius of the end circles (was 3.5px) */
    --bg: #fafbf7;   /* white with a very faint tint of the green string */
    --nav-top: calc(min(100vw * 1020 / 1600, 100vh) * 0.035);
    --doodle-w: clamp(64px, 5vw, 90px);
    --doodle-h: calc(var(--doodle-w) * 0.4375);
    --header-h: calc(var(--nav-top) + var(--doodle-h) + 18px);
  }
  #site-header {
    position: absolute; top: 0; left: 0; right: 0; height: var(--header-h);
    background: transparent; border: 0; z-index: 50;
    font-family: 'Switzer', sans-serif;
  }
  #brand { position: absolute; top: var(--nav-top); left: 2%; display: flex; align-items: center; gap: 12px; height: var(--doodle-h); text-decoration: none; color: #141414; }
  #brand:hover { opacity: 0.7; }
  #brand-doodle { width: var(--doodle-w); height: var(--doodle-h); display: block; overflow: visible; }
  #brand-doodle .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  #brand-text { display: flex; flex-direction: column; justify-content: center; height: var(--doodle-h); }
  #brand-name { font-size: calc(var(--doodle-w) * 0.225); line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; }
  #brand-role { position: relative; overflow: hidden; height: 1.15em; line-height: 1.15; font-size: calc(var(--doodle-w) * 0.165); font-weight: 400; color: #8a8a8a; min-width: 9em; }
  #brand-role span { position: absolute; left: 0; top: 0; white-space: nowrap; transform: translateY(110%); opacity: 0; transition: transform 0.6s cubic-bezier(.2,.8,.2,1), opacity 0.6s ease; }
  #brand-role span.in  { transform: translateY(0); opacity: 1; }
  #brand-role span.out { transform: translateY(-110%); opacity: 0; }

  /* Link row: small caps, brackets fade in on hover. The current
     section keeps its brackets showing, e.g. ( WORK ). */
  .site-links { display: flex; gap: clamp(28px, 3.2vw, 56px); align-items: center; justify-content: center; font-family: 'Switzer', sans-serif; }
  .site-links a {
    position: relative;
    font-size: clamp(11px, 0.8vw, 13px); font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: #141414; text-decoration: none; white-space: nowrap;
  }
  .site-links a::before, .site-links a::after { position: absolute; top: 0; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; }
  .site-links a::before { content: '('; right: 100%; margin-right: 0.45em; transform: translateX(4px); }
  .site-links a::after  { content: ')'; left: 100%;  margin-left: 0.45em;  transform: translateX(-4px); }
  .site-links a:hover::before, .site-links a:hover::after,
  .site-links a:focus-visible::before, .site-links a:focus-visible::after,
  .site-links a.current::before, .site-links a.current::after { opacity: 1; transform: translateX(0); }

  @media (prefers-reduced-motion: reduce) {
    #brand-doodle .eye { animation: none; }
    #brand-role span { transition: none; }
  }
</style>
</head>

      <svg id="lines-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="grid-crayon" filterUnits="userSpaceOnUse" x="-4000" y="-4000" width="8000" height="8000">
            <feTurbulence type="fractalNoise" baseFrequency="0.7 0.7" numOctaves="2" seed="9" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>

<script>
/* =========================================================================
   PROJECTS — this is the ONLY place you should need to touch to add work.

   For each project set:
     title  : shown below the cutout on hover
     tags   : array of short strings, shown top-right of the cell on hover
     image  : path or URL to your image file. Leave "" for a plain grey
              placeholder circle (just a generic stand-in until you add
              the real thing).
     sizeVh : optional. How tall the image can grow, in vh (viewport
              height percent). Leave it out to use the default (38).
              Delhi AQI is at 46 (was reading small at the default).
              Rushikulya coast is dropped to 28 -- the turtle was reading
              noticeably bigger than everything else at the same cap,
              since its own shape is wide enough to hit the width limit
              before the height cap ever kicks in. Posture Corrector is
              bumped to 52 -- the opposite problem, its shape is tall and
              narrow so even a generous height cap left it looking small.
              Change any of these directly if they still don't feel
              right once you see them live.
     offsetY : optional. Small vertical nudge (as a %, negative moves up),
               for when an image's actual file has uneven empty space
               above/below the visible artwork -- CSS can center the
               image's own bounding box, but can't know that the artwork
               inside it isn't centered within that box. Posture Corrector
               needed this because its illustration was sitting visibly
               lower than the turtle/Patang images beside it in the same
               row. Adjust the number directly if it's not quite right.
     offsetX : optional. Same idea, sideways (as a %, negative moves left).
               Patang uses it because its artwork sits right of centre
               inside its own file, so it looked off-centre against the
               title + tags below it.
     url    : the project's own page.
     cutout : not currently used for styling -- every image is shown at
              its own natural shape now, nothing is cropped into a circle
              or any other mask. Kept here in case you want to treat
              cutouts differently again later (e.g. sizing them larger).

   The 6 entries fill the grid left-to-right, top-to-bottom — this order
   also drives which lines light up on hover, see CELL_BORDER_SEGMENTS
   and CELL_ACCENT_COLORS further down in the second <script> block.
   Current layout (Option 2 from the arrangement preview):
     Delhi AQI          | Underneath it all  | Shadow at rest
     Rushikulya coast   | Posture Corrector  | Patang
   ========================================================================= */
  const DEFAULT_IMAGE_VH = 38;

  const PROJECTS = [
    { title: "Delhi AQI",                  tags: ["Data Viz", "Research", "UI/UX"],       image: "Delhi AQI.png",     cutout: false, sizeVh: 46, url: "delhi-aqi.html" },
    { title: "Underneath it all",          tags: ["Systems Design", "Research"],                      image: "SewageTNF.png",  cutout: false, url: "underneath-it-all.html" },
    { title: "Shadow at rest",             tags: ["Interactive Installation", "Experience Design"],                   image: "shadow1.png",        cutout: false, url: "shadow-at-rest.html" },
    { title: "Along the Rushikulya coast", tags: ["VR World Building", "Multisensory"],   image: "turtleThumbnail.png", cutout: true, sizeVh: 28, url: "along-the-rushikulya-coast.html" },
    { title: "Posture Corrector",          tags: ["Product Design", "UX Research"],    image: "backPosture.png",       cutout: false, sizeVh: 52, offsetY: -22, url: "posture-corrector.html" },
    { title: "Patang",                     tags: ["Packaging Design", "Illustrations"],                image: "PatangTN.png",   cutout: false, offsetX: -16, url: "patang.html" },
  ];

  const gridCells = document.getElementById('grid-cells');
  const cellEls = [];
  const visualEls = [];

  PROJECTS.forEach((p, i) => {
    const cell = document.createElement('a');
    cell.className = 'cell';
    cell.href = p.url || '#';

    const visual = document.createElement('div');
    visual.className = 'visual';
    if (p.image) {
      const img = document.createElement('img');
      img.src = p.image;
      img.alt = p.title;
      img.dataset.vh = p.sizeVh || DEFAULT_IMAGE_VH;   // sized in fitThumbs() below
      if (p.offsetX || p.offsetY) img.style.transform = `translate(${p.offsetX || 0}%, ${p.offsetY || 0}%)`;
      visual.appendChild(img);
    } else {
      const shape = document.createElement('div');
      shape.className = 'placeholder-shape';
      visual.appendChild(shape);
    }
    cell.appendChild(visual);

    // First 3 projects = top row, last 3 = bottom row.
    cell.classList.add(i < 3 ? 'row-top' : 'row-bottom');

    const bar = document.createElement('div');
    bar.className = 'label-bar';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.title;
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = p.tags.join(', ');
    bar.appendChild(name);
    bar.appendChild(tag);
    cell.appendChild(bar);

    gridCells.appendChild(cell);
    cellEls.push(cell);
    visualEls.push(visual);
  });

  /* Thumbnails are sized against the grid's height, so they keep the same
     size and spacing relative to the lines as on the earlier Work page
     (where the grid was 95% of the screen height minus a 70px bar), even
     now that the grid has moved up to make room for the link row. */
  function fitThumbs() {
    const grid = document.getElementById('grid-wrap');
    const oldGridH = window.innerHeight * 0.95 - 70;
    const scale = grid.getBoundingClientRect().height / oldGridH;
    document.querySelectorAll('.visual img').forEach(img => {
      img.style.maxHeight = (parseFloat(img.dataset.vh) * scale) + 'vh';
    });
  }
  fitThumbs();
  window.addEventListener('resize', fitThumbs);

  /* blur every OTHER cell's visual, and light up this cell's bordering
     lines, while it's hovered (see setHoveredWorkCell in the lines script) */
  cellEls.forEach((cell, i) => {
    cell.addEventListener('mouseenter', () => {
      visualEls.forEach((v, j) => { if (j !== i) v.classList.add('blurred'); });
      if (window.setHoveredWorkCell) window.setHoveredWorkCell(i);
    });
    cell.addEventListener('mouseleave', () => {
      visualEls.forEach(v => v.classList.remove('blurred'));
      if (window.setHoveredWorkCell) window.setHoveredWorkCell(-1);
    });
  });
</script>

<script>
(function(){
  'use strict';

  const svg = document.getElementById('lines-svg');
  const svgNS = 'http://www.w3.org/2000/svg';

  const N = 24;            // sample points per segment
  const RADIUS = 180;      // px — how far the cursor's interactive pull reaches
  const MAX_DISP = 26;     // px — how far a segment can bulge from cursor interaction, at most
  const EASE = 0.15;       // how quickly a segment eases toward its interactive target
  const EDGE_TAPER = 0.16; // fraction of segment length near each pinned end damped to zero
  /* V_MARGIN and END_CAP_R are read from the CSS (--grid-v-margin, --pin-r)
     so the hover labels can line up with the line ends exactly. */
  const rootStyle = getComputedStyle(document.documentElement);
  const V_MARGIN = parseFloat(rootStyle.getPropertyValue('--grid-v-margin')) || 36;  // gap the vertical segments keep from the very top/bottom
  const H_MARGIN = 36;     // gap the horizontal segments keep from the very left/right edges (was 56)
  const END_CAP_R = parseFloat(rootStyle.getPropertyValue('--pin-r')) || 4.2;        // radius of the small circle capping each segment's outer end
  const PIN_DEADZONE = 62; // px — no interactive bulge this close to ANY pinned point

  /* ---- resting waviness ---- */
  const ANIMATE_IDLE = true;
  const WAVE_AMP = 10;   // how wavy the dividing lines are at rest
  const WAVE_FREQ_RANGE = [0.8, 1.2];
  const DRIFT_SPEED_RANGE = [0.05, 0.13];

  /* ---- hover accent colours -------------------------------------------
     One colour per PROJECTS entry (same order). The first five reuse the
     landing page's string colours; the 6th (teal) is new since the grid
     has one more section than the landing page has strings. Change any
     entry here any time — nothing else needs to be touched. */
  const CELL_ACCENT_COLORS = ['#2d5c78', '#7c8a3a', '#a83a2e', '#d68c2e', '#6f4e94', '#1f8a7a'];

  /* Which of the 7 line segments (see `defs` in buildSegments below, same
     index order: 0/1 = left vertical top/bottom half, 2/3 = right vertical
     top/bottom half, 4/5/6 = horizontal left/middle/right piece) border
     each of the 6 cells, in the same left-to-right/top-to-bottom order as
     PROJECTS. Corner cells border 2 lines, middle-column cells border 3. */
  const CELL_BORDER_SEGMENTS = [
    [0, 4],      // Delhi AQI            — top-left
    [0, 2, 5],   // Underneath it all    — top-middle
    [2, 6],      // Shadow at rest       — top-right
    [1, 4],      // Along the Rushikulya coast — bottom-left
    [1, 3, 5],   // Posture Corrector    — bottom-middle
    [3, 6],      // Patang               — bottom-right
  ];

  const DEFAULT_STROKE = '#bdbdbd';   // light grey; hovered cell's lines still take its colour
  let hoveredCellIndex = -1;
  window.setHoveredWorkCell = function (idx) { hoveredCellIndex = idx; };

  /* Which segment indices each pin dot sits on top of / where lines cross.
     Order matches the `pins` array built in buildSegments:
     0:(x1,topY) 1:(x1,midY) 2:(x1,botY) 3:(x2,topY) 4:(x2,midY) 5:(x2,botY)
     6:(leftX,midY) 7:(rightX,midY). */
  const PIN_SEGMENTS = [
    [0],
    [0, 1, 4, 5],
    [1],
    [2],
    [2, 3, 5, 6],
    [3],
    [4],
    [6],
  ];

  let w = 0, h = 0;
  let mouseX = -99999, mouseY = -99999;
  let segments = [];
  let pins = [];
  let pinEls = [];
  const t0 = performance.now();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function buildSegments() {
    svg.querySelectorAll('path, circle').forEach(p => p.remove());
    segments = [];

    const x1 = w / 3, x2 = (w * 2) / 3, midY = h / 2;
    const topY = V_MARGIN, botY = h - V_MARGIN;
    const leftX = H_MARGIN, rightX = w - H_MARGIN;

    pins = [
      { x: x1, y: topY }, { x: x1, y: midY }, { x: x1, y: botY },
      { x: x2, y: topY }, { x: x2, y: midY }, { x: x2, y: botY },
      { x: leftX, y: midY }, { x: rightX, y: midY },
    ];

    const defs = [
      { x1: x1,  y1: topY, x2: x1,  y2: midY, axis: 'v' }, // 0
      { x1: x1,  y1: midY, x2: x1,  y2: botY, axis: 'v' }, // 1
      { x1: x2,  y1: topY, x2: x2,  y2: midY, axis: 'v' }, // 2
      { x1: x2,  y1: midY, x2: x2,  y2: botY, axis: 'v' }, // 3
      { x1: leftX,  y1: midY, x2: x1,    y2: midY, axis: 'h' }, // 4
      { x1: x1,     y1: midY, x2: x2,    y2: midY, axis: 'h' }, // 5
      { x1: x2,     y1: midY, x2: rightX, y2: midY, axis: 'h' }, // 6
    ];

    defs.forEach(d => {
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('filter', 'url(#grid-crayon)');
      svg.appendChild(path);
      segments.push({
        ...d,
        pathEl: path,
        disp: new Array(N).fill(0),
        waveFreq: rand(WAVE_FREQ_RANGE[0], WAVE_FREQ_RANGE[1]),
        wavePhase: rand(0, Math.PI * 2),
        driftSpeed: rand(DRIFT_SPEED_RANGE[0], DRIFT_SPEED_RANGE[1]) * (Math.random() < 0.5 ? 1 : -1),
      });
    });

    pinEls = pins.map(p => {
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', END_CAP_R);
      svg.appendChild(c);
      return c;
    });
  }

  function catmullRomPath(points) {
    let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i - 1)], p1 = points[i], p2 = points[i + 1], p3 = points[Math.min(points.length - 1, i + 2)];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    }
    return d;
  }

  function smoothstep(x) { return x * x * (3 - 2 * x); }

  function render(now) {
    const elapsed = ANIMATE_IDLE ? (now - t0) / 1000 : 0;
    const activeSet = hoveredCellIndex >= 0 ? CELL_BORDER_SEGMENTS[hoveredCellIndex] : null;
    const activeColor = hoveredCellIndex >= 0 ? CELL_ACCENT_COLORS[hoveredCellIndex] : null;

    segments.forEach((seg, segIndex) => {
      const pts = [];
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        const baseX = seg.x1 + (seg.x2 - seg.x1) * t;
        const baseY = seg.y1 + (seg.y2 - seg.y1) * t;

        const edge = Math.min(t, 1 - t);
        const taper = smoothstep(Math.min(1, edge / EDGE_TAPER));

        const phase = seg.wavePhase + elapsed * seg.driftSpeed;
        const waveOffset = Math.sin(t * seg.waveFreq * Math.PI * 2 + phase) * WAVE_AMP * taper;

        const dx = mouseX - baseX, dy = mouseY - baseY;
        const dist = Math.hypot(dx, dy);
        let influence = Math.max(0, 1 - dist / RADIUS);
        influence = smoothstep(influence);

        let nearestPinDist = Infinity;
        for (let k = 0; k < pins.length; k++) {
          const pd = Math.hypot(baseX - pins[k].x, baseY - pins[k].y);
          if (pd < nearestPinDist) nearestPinDist = pd;
        }
        const pinSuppress = smoothstep(Math.min(1, nearestPinDist / PIN_DEADZONE));

        const sign = seg.axis === 'v' ? (dx || 0.0001) : (dy || 0.0001);
        const targetDisp = influence * MAX_DISP * taper * pinSuppress * Math.sign(sign);

        seg.disp[i] += (targetDisp - seg.disp[i]) * EASE;
        if (Math.abs(seg.disp[i]) < 0.01) seg.disp[i] = 0;

        const totalOffset = waveOffset + seg.disp[i];
        const px = seg.axis === 'v' ? baseX + totalOffset : baseX;
        const py = seg.axis === 'h' ? baseY + totalOffset : baseY;
        pts.push({ x: px, y: py });
      }
      seg.pathEl.setAttribute('d', catmullRomPath(pts));

      const shouldBeActive = activeSet && activeSet.indexOf(segIndex) !== -1;
      seg.pathEl.style.stroke = shouldBeActive ? activeColor : DEFAULT_STROKE;
    });

    pinEls.forEach((circle, pinIndex) => {
      const touchesActive = activeSet && PIN_SEGMENTS[pinIndex].some(s => activeSet.indexOf(s) !== -1);
      circle.style.fill = touchesActive ? activeColor : DEFAULT_STROKE;
    });

    requestAnimationFrame(render);
  }

  function measure() {
    const r = svg.getBoundingClientRect();
    w = r.width; h = r.height;
    buildSegments();
  }

  document.getElementById('grid-wrap').addEventListener('pointermove', (e) => {
    const r = svg.getBoundingClientRect();
    mouseX = e.clientX - r.left;
    mouseY = e.clientY - r.top;
  });
  document.getElementById('grid-wrap').addEventListener('pointerleave', () => {
    mouseX = -99999; mouseY = -99999;
  });

  window.addEventListener('resize', measure);
  window.addEventListener('load', measure);
  measure();
  requestAnimationFrame(render);

})();
</script>


<script>
/* Rotating title under the name (same as the home page). */
(function () {
  const INTERVAL = 2600;
  const items = Array.from(document.querySelectorAll('#brand-role span'));
  if (items.length < 2 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let i = 0;
  setInterval(() => {
    const cur = items[i]; i = (i + 1) % items.length; const next = items[i];
    cur.classList.remove('in'); cur.classList.add('out');
    next.classList.remove('out');
    next.style.transition = 'none'; next.style.transform = 'translateY(110%)';
    void next.offsetWidth;
    next.style.transition = ''; next.style.transform = '';
    next.classList.add('in');
    setTimeout(() => cur.classList.remove('out'), 650);
  }, INTERVAL);
})();

/* Email links: copy the address and show "Copied!" for 2 seconds. */
(function () {
  document.querySelectorAll('.email-link').forEach(link => {
    const original = link.textContent; let timer = null;
    link.addEventListener('click', e => {
      e.preventDefault();
      const email = link.dataset.email;
      const fallback = () => {
        const ta = document.createElement('textarea'); ta.value = email;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(email).catch(fallback); else fallback();
      link.textContent = 'Copied!';
      clearTimeout(timer); timer = setTimeout(() => { link.textContent = original; }, 2000);
    });
  });
})();
</script>
