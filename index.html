<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #fafbf7; /* white with a very faint tint of the green string */ font-family: 'Switzer', sans-serif; color: #141414; overflow-x: hidden; }

    #canvas { position: relative; width: 100vw; aspect-ratio: 1600 / 1020; max-height: 100vh; margin: 0 auto; overflow: hidden; }

    /* ── Top bar: name block + hint on the left, sound toggle on the right.
       --doodle-w sets the logo size; the name + title and the sound icon
       are sized from it so they always match the logo's height. ── */
    #topbar {
      --doodle-w: clamp(64px, 5vw, 90px);
      --doodle-h: calc(var(--doodle-w) * 0.4375);   /* logo height (28/64 of its width) */
      position: absolute; top: 3.5%; left: 2%; right: 2%;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    #brand-col { display: flex; flex-direction: column; align-items: flex-start; }
    #brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #141414; height: var(--doodle-h); }
    #brand-doodle { width: var(--doodle-w); height: var(--doodle-h); display: block; overflow: visible; }
    #brand-doodle .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

    /* name + title together = exactly the logo's height */
    #brand-text { display: flex; flex-direction: column; justify-content: center; height: var(--doodle-h); }
    #brand-name { font-size: calc(var(--doodle-w) * 0.225); line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; }

    /* Rotating title: one line tall, each title slides up and out as the
       next slides in. Titles + timing are set in the script at the bottom. */
    #brand-role {
      position: relative; overflow: hidden;
      height: 1.15em; line-height: 1.15;
      font-size: calc(var(--doodle-w) * 0.165); font-weight: 400; color: #8a8a8a;
      min-width: 9em;
    }
    #brand-role span {
      position: absolute; left: 0; top: 0; white-space: nowrap;
      transform: translateY(110%); opacity: 0;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1), opacity 0.6s ease;
    }
    #brand-role span.in  { transform: translateY(0);     opacity: 1; }
    #brand-role span.out { transform: translateY(-110%); opacity: 0; }

    /* Hint line, small and grey, left-aligned with the logo, sitting halfway
       between the logo and the top of the strings. Change top: 24% to move
       it up (smaller) or down (bigger). */
    #hint {
      position: absolute; top: 24%; left: 2%;
      transform: translateY(-50%);
      margin: 0;
      /* same size, font and weight as the coloured project name shown on hover */
      font-size: clamp(12px,1.15vw,18px); font-weight: 500; line-height: 1.4; color: #a6a6a6;
      pointer-events: none; user-select: none;
    }

    /* Box around the sound icon, same height as the logo, so the icon
       sits on the same centre line as the name block */
    #sound-box { height: var(--doodle-h); display: flex; align-items: center; }

    #wave-svg { position: absolute; top: 42%; left: 0; width: 100%; height: 20.5%; overflow: visible; }

    /* Caption — split into two stacked lines, same overall position, since one line ran too long */
    #caption {
      position: absolute; top: 72.5%; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 0.3em;
      text-align: center; font-size: clamp(12px,1.15vw,18px); font-weight: 500;
      line-height: 1.4; color: #141414; opacity: 0; transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.2s ease;
      pointer-events: none; user-select: none;
    }
    #caption.visible { opacity: 1; transform: translateY(0); }

    /* ── Bottom links: one centred row, small caps. On hover, brackets
       fade in on both sides -- they sit outside the word, so nothing
       around it shifts. ── */
    #bottom-nav {
      position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
      display: flex; gap: clamp(28px, 3.2vw, 56px); align-items: center;
    }
    #bottom-nav a {
      position: relative;
      font-size: clamp(11px, 0.8vw, 13px); font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #141414; text-decoration: none; white-space: nowrap;
    }
    #bottom-nav a::before, #bottom-nav a::after {
      position: absolute; top: 0; opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #bottom-nav a::before { content: '('; right: 100%; margin-right: 0.45em; transform: translateX(4px); }
    #bottom-nav a::after  { content: ')'; left: 100%;  margin-left: 0.45em;  transform: translateX(-4px); }
    #bottom-nav a:hover::before, #bottom-nav a:hover::after,
    #bottom-nav a:focus-visible::before, #bottom-nav a:focus-visible::after { opacity: 1; transform: translateX(0); }
    #brand:hover { opacity: 0.7; }

    /* ── Sound toggle — static icon, two fixed states, no pulsing animation ── */
    #sound-toggle {
      position: relative;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: clamp(11px, 0.95vw, 15px);
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    #sound-toggle:hover { opacity: 0.55; }

    #sound-toggle .bar {
      width: 1.5px;
      background: #8a8a8a;
      border-radius: 1px;
      transform-origin: bottom;
      transition: height 0.25s ease, background 0.25s ease;
    }

    /* ON — fixed EQ-style heights, static */
    #sound-toggle.on .bar:nth-child(1) { height: 45%; }
    #sound-toggle.on .bar:nth-child(2) { height: 75%; }
    #sound-toggle.on .bar:nth-child(3) { height: 100%; }
    #sound-toggle.on .bar:nth-child(4) { height: 60%; }
    #sound-toggle.on .bar:nth-child(5) { height: 35%; }

    @media (prefers-reduced-motion: reduce) {
      #brand-doodle .eye { animation: none; }
      #brand-role span { transition: none; }
    }

    /* OFF — flattened + gray, static */
    #sound-toggle.off .bar { height: 18%; background: #cfcfcf; }

    /* ── Intro / enter screen ─────────────────────────────────────────
       Covers the page on a first visit. Clicking anywhere (or pressing
       any key) counts as the visitor's first interaction, which is what
       browsers require before a page may play sound -- so the strings
       make sound from the very first hover after this.
       If the browser already allows sound (e.g. Chrome when coming back
       from the Work page), the screen is skipped entirely. */
    #intro {
      position: fixed; inset: 0; z-index: 100;
      background: #fafbf7;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(22px, 2.4vw, 36px);
      cursor: pointer;
      opacity: 0;                      /* faded in only if it's needed (see script) */
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #intro.show { opacity: 1; }
    #intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    #intro-doodle { width: clamp(130px, 11vw, 190px); height: auto; display: block; overflow: visible; }
    #intro-doodle .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite 1.4s; }
    /* the head rises up from behind the ledge when the screen appears */
    #intro-doodle .head { transform-box: view-box; transform: translateY(14px); opacity: 0;
      transition: transform 1.1s cubic-bezier(.2,.8,.2,1) 0.25s, opacity 0.5s ease 0.25s; }
    #intro.show #intro-doodle .head { transform: translateY(0); opacity: 1; }

    #intro-enter {
      position: relative;
      background: none; border: 0; padding: 0; cursor: pointer;
      font-family: inherit; font-size: clamp(11px, 0.8vw, 13px); font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; color: #141414;
      opacity: 0; transition: opacity 0.6s ease 1.1s;
    }
    #intro.show #intro-enter { opacity: 1; }
    /* same bracket style as the nav links, always showing here, gently breathing */
    #intro-enter::before, #intro-enter::after { position: absolute; top: 0; animation: breathe 2.4s ease-in-out infinite; }
    #intro-enter::before { content: '('; right: 100%; margin-right: 0.45em; }
    #intro-enter::after  { content: ')'; left: 100%;  margin-left: 0.45em; }
    @keyframes breathe { 0%, 100% { opacity: 1; transform: translateX(0); } 50% { opacity: 0.35; } }
    #intro-enter::before { --dir: 1; }
    #intro:hover #intro-enter::before { transform: translateX(-3px); }
    #intro:hover #intro-enter::after  { transform: translateX(3px); }

    @media (prefers-reduced-motion: reduce) {
      #intro, #intro-enter, #intro-doodle .head { transition: none; }
      #intro-doodle .eye, #intro-enter::before, #intro-enter::after { animation: none; }
    }
  </style>
</head>

<script>
/* ── Email: copy to clipboard, show "Copied!" for 2 seconds ── */
(function () {
  const link = document.getElementById('email-link');
  if (!link) return;
  const originalText = link.textContent;
  let resetTimer = null;

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  link.addEventListener('click', (e) => {
    e.preventDefault();
    const email = link.dataset.email;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).catch(() => fallbackCopy(email));
    } else {
      fallbackCopy(email);
    }
    link.textContent = 'Copied!';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { link.textContent = originalText; }, 2000);
  });
})();
</script>

<script>
(function(){
  'use strict';

  // ─── Visual constants ────────────────────────────────────────────────────
  const NUM_POINTS = 42, BLEND_ZONE = 0.14, HIT_THRESHOLD = 16, STICKY_MARGIN = 6;
  const LINE_COLORS = ['#2d5c78','#7c8a3a','#a83a2e','#d68c2e','#6f4e94'];

  // Clicking a line opens its project directly. Same colour order as the
  // Work page: navy = Delhi AQI, green = Underneath it all, red = Shadow
  // at rest, orange = Along the Rushikulya coast, purple = Posture Corrector.
  const LINE_TITLES = ["Why does Delhi's air crisis never feel like an emergency?", "Can we call ourselves empathetic if our empathy only shows up when it's convenient?", "Wouldn't it be strange if your shadow stopped following you around?", 'Ever wanted to swim like a turtle?', "You're slouching right now, aren't you?"];
  const captionTitle = document.getElementById('caption-title');

  const LINE_LINKS = [
    'delhi-aqi.html',
    'underneath-it-all.html',
    'shadow-at-rest.html',
    'along-the-rushikulya-coast.html',
    'posture-corrector.html',
  ];

  // Major pentatonic: C4 D4 E4 G4 A4 — every 4-note subset of this set is consonant,
  // so whichever line is hovered (and excluded), the remaining four always sound good together.
  const PITCHES = [261.63, 293.66, 329.63, 392.00, 440.00];

  // Stereo pan per line: navy far-left → purple far-right
  const PANS = [-0.65, -0.3, 0.0, 0.3, 0.65];

  // Per-string character (like real guitar strings differing by thickness):
  // brightness = lowpass cutoff multiplier, decay = Karplus-Strong feedback decay factor
  const STRING_BRIGHTNESS = [4.5, 5.2, 6.0, 7.0, 8.2];   // navy warmest → purple brightest
  const STRING_DECAY      = [0.9945, 0.9942, 0.9938, 0.9933, 0.9928]; // navy longest sustain → purple shortest

  const LINE_PARAMS = [
    {anchorFrac:0.35, amp:0.34, freq:1.5,  phase:0.0,  animSpeed:0.55},
    {anchorFrac:0.20, amp:0.38, freq:1.2,  phase:1.1,  animSpeed:0.70},
    {anchorFrac:0.50, amp:0.28, freq:1.8,  phase:2.2,  animSpeed:0.48},
    {anchorFrac:0.68, amp:0.32, freq:1.0,  phase:0.8,  animSpeed:0.62},
    {anchorFrac:0.80, amp:0.26, freq:2.0,  phase:3.5,  animSpeed:0.80},
  ];

  // ─── State ───────────────────────────────────────────────────────────────
  let svgW = 0, svgH = 0;
  let phases = LINE_PARAMS.map(p => p.phase);
  let frozenPhases = phases.slice();
  let hoveredLine = -1, animRafId = null, lastTime = null;
  let introOpen = true;   // true while the enter screen covers the page -- strings ignore the mouse until it's gone
  const reducedMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  // ─── DOM ─────────────────────────────────────────────────────────────────
  const svgEl      = document.getElementById('wave-svg');
  const pathEls    = Array.from({length:5}, (_,i) => document.getElementById('line-'+i));
  const captionEl  = document.getElementById('caption');
  const toggleBtn  = document.getElementById('sound-toggle');
  let cachedPoints = Array(5).fill(null);

  // ─── Geometry ────────────────────────────────────────────────────────────
  function computePoints(li, phaseArr) {
    const p = LINE_PARAMS[li];
    const anchorY = p.anchorFrac * svgH;
    const amp = p.amp * svgH;
    const pts = [];
    for (let i = 0; i < NUM_POINTS; i++) {
      const t = i / (NUM_POINTS - 1);
      let blend = t < BLEND_ZONE ? t / BLEND_ZONE : t > 1 - BLEND_ZONE ? (1 - t) / BLEND_ZONE : 1;
      blend = 0.5 - 0.5 * Math.cos(blend * Math.PI);
      pts.push({ x: t * svgW, y: anchorY + Math.sin(t * p.freq * 2 * Math.PI + phaseArr[li]) * amp * blend });
    }
    return pts;
  }

  function toCRPath(pts) {
    if (pts.length < 2) return '';
    let d = 'M ' + pts[0].x.toFixed(2) + ' ' + pts[0].y.toFixed(2);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      const a = 0.5;
      d += ' C ' + (p1.x+(p2.x-p0.x)*a/3).toFixed(2) + ' ' + (p1.y+(p2.y-p0.y)*a/3).toFixed(2)
         + ', ' + (p2.x-(p3.x-p1.x)*a/3).toFixed(2) + ' ' + (p2.y-(p3.y-p1.y)*a/3).toFixed(2)
         + ', ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
    }
    return d;
  }

  function drawAllLines(phaseArr) {
    for (let i = 0; i < 5; i++) {
      cachedPoints[i] = computePoints(i, phaseArr);
      pathEls[i].setAttribute('d', toCRPath(cachedPoints[i]));
    }
  }

  // ─── Hit detection ───────────────────────────────────────────────────────
  function distToLine(pts, mx, my) {
    let minD = Infinity;
    for (let i = 0; i < pts.length - 1; i++) {
      const ax=pts[i].x, ay=pts[i].y, bx=pts[i+1].x, by=pts[i+1].y;
      const dx=bx-ax, dy=by-ay, lenSq=dx*dx+dy*dy;
      const t = Math.max(0, Math.min(1, lenSq > 0 ? ((mx-ax)*dx+(my-ay)*dy)/lenSq : 0));
      const d = Math.hypot(mx-ax-t*dx, my-ay-t*dy);
      if (d < minD) minD = d;
    }
    return minD;
  }

  function findHoveredLine(sx, sy) {
    let minD = Infinity, nearest = -1;
    for (let i = 0; i < 5; i++) {
      if (!cachedPoints[i]) continue;
      const d = distToLine(cachedPoints[i], sx, sy);
      if (d < minD) { minD = d; nearest = i; }
    }
    return minD > HIT_THRESHOLD ? -1 : nearest;
  }

  // ─── Animation loop ──────────────────────────────────────────────────────
  function animFrame(ts) {
    if (hoveredLine < 0) { animRafId = null; return; }
    const dt = lastTime !== null ? (ts - lastTime) / 1000 : 0;
    lastTime = ts;
    const rp = phases.slice();
    for (let i = 0; i < 5; i++) {
      if (i !== hoveredLine) phases[i] += LINE_PARAMS[i].animSpeed * dt;
      rp[i] = phases[i];
    }
    rp[hoveredLine] = frozenPhases[hoveredLine];
    drawAllLines(rp);
    animRafId = requestAnimationFrame(animFrame);
  }

  function startAnim() { if (animRafId) return; lastTime = null; animRafId = requestAnimationFrame(animFrame); }
  function stopAnim()  { if (animRafId) { cancelAnimationFrame(animRafId); animRafId = null; } lastTime = null; }

  // ─── Hover events ────────────────────────────────────────────────────────
  function onEnter(li) {
    hoveredLine = li;
    frozenPhases = phases.slice();
    pathEls[li].setAttribute('stroke-width', '7');
    document.body.style.cursor = 'pointer'; // the line is clickable
    captionEl.style.color = LINE_COLORS[li];
    if (captionTitle) captionTitle.textContent = LINE_TITLES[li];
    captionEl.classList.add('visible');
    if (!reducedMotion) startAnim();
    playHover(li); // one note for this string, then a short phrase right after
  }

  function onLeave() {
    if (hoveredLine < 0) return;
    const prev = hoveredLine;
    hoveredLine = -1;
    pathEls[prev].setAttribute('stroke-width', '5');
    document.body.style.cursor = '';
    captionEl.classList.remove('visible');
    stopAnim();
    clearTimeout(chordDelayTimerId);
    clearChordTimer();
    drawAllLines(phases);
  }

  function clientToSVG(cx, cy) {
    const r = svgEl.getBoundingClientRect();
    return { x: (cx - r.left) * (svgW / r.width), y: (cy - r.top) * (svgH / r.height) };
  }

  document.addEventListener('pointermove', e => {
    if (introOpen) return;   // enter screen still covering the strings
    const r = svgEl.getBoundingClientRect(), pad = 30;
    const inArea = e.clientX >= r.left-pad && e.clientX <= r.right+pad && e.clientY >= r.top-pad && e.clientY <= r.bottom+pad;
    if (!inArea) { if (hoveredLine >= 0) onLeave(); return; }
    const { x: sx, y: sy } = clientToSVG(e.clientX, e.clientY);
    const cand = findHoveredLine(sx, sy);
    if (cand < 0) { if (hoveredLine >= 0) onLeave(); return; }
    if (hoveredLine >= 0 && cand !== hoveredLine) {
      const cd = distToLine(cachedPoints[hoveredLine], sx, sy);
      const nd = distToLine(cachedPoints[cand], sx, sy);
      if (cd - nd < STICKY_MARGIN) return;
      onLeave(); onEnter(cand);
    } else if (hoveredLine < 0) {
      onEnter(cand);
    }
  });

  document.addEventListener('pointerleave', () => { if (hoveredLine >= 0) onLeave(); });

  // Click on a line -> go straight to that line's project.
  document.addEventListener('click', e => {
    if (introOpen) return;   // a click on the enter screen never opens a project
    if (e.target.closest('a, button, #intro')) return;
    let li = hoveredLine;
    if (li < 0) {
      // taps on touch screens don't hover first, so check the tap position
      const { x: sx, y: sy } = clientToSVG(e.clientX, e.clientY);
      li = findHoveredLine(sx, sy);
    }
    if (li < 0 || !LINE_LINKS[li]) return;
    window.location.href = LINE_LINKS[li];
  });

  // ─── Resize / init ───────────────────────────────────────────────────────
  function measure() { const r = svgEl.getBoundingClientRect(); svgW = r.width; svgH = r.height; }
  function init() { measure(); drawAllLines(phases); }

  window.addEventListener('resize', () => {
    measure();
    const rp = phases.slice();
    if (hoveredLine >= 0) rp[hoveredLine] = frozenPhases[hoveredLine];
    drawAllLines(rp);
  });

  if (document.readyState === 'complete') requestAnimationFrame(init);
  else window.addEventListener('load', () => requestAnimationFrame(init));

  // ═══════════════════════════════════════════════════════════════════════════
  //  AUDIO — soft marimba through a shared glue bus (see SOUND below)
  // ═══════════════════════════════════════════════════════════════════════════
  let audioCtx  = null;
  let soundEnabled  = true;

  let glueBus  = null;   // { reverbIn, reverb, comp, masterGain }
  let chordTimerId = null;
  let chordDelayTimerId = null;
  const CHORD_START_DELAY = 2.6; // seconds of just-the-hovered-note silence before the ambient loop begins

  // ── Toggle button ──────────────────────────────────────────────────────
  // Sound is ON by default; the icon turns it off and on.
  // (Browsers only let a page make sound after the visitor's first click,
  // tap or key press anywhere on it -- the enter screen takes care of that.)
  function updateSoundIcon() {
    toggleBtn.classList.toggle('on', soundEnabled);
    toggleBtn.classList.toggle('off', !soundEnabled);
    const label = soundEnabled ? 'Turn sound off' : 'Turn sound on';
    toggleBtn.setAttribute('aria-label', label);
    toggleBtn.title = label;
  }

  toggleBtn.addEventListener('click', () => {
    ensureAudio();
    soundEnabled = !soundEnabled;
    if (glueBus) {
      glueBus.masterGain.gain.setTargetAtTime(soundEnabled ? 1 : 0, audioCtx.currentTime, 0.05);
    }
    if (!soundEnabled) { clearChordTimer(); clearTimeout(chordDelayTimerId); }
    updateSoundIcon();
  });

  // ── AudioContext bootstrap ─────────────────────────────────────────────
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      buildGlueBus();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function audioReady() {
    return !!audioCtx && audioCtx.state === 'running' && soundEnabled;
  }

  // Unlock sound on the visitor's first interaction of any kind.
  document.addEventListener('pointerdown', e => { if (!toggleBtn.contains(e.target)) ensureAudio(); });
  document.addEventListener('touchstart', ensureAudio, { passive: true });
  document.addEventListener('keydown', ensureAudio);

  // ── Shared glue bus: [voice] → reverb (convolver, blended) → compressor → masterGain → out
  function buildGlueBus() {
    const ctx = audioCtx;

    const revTime  = 1.1, revDecay = 3.0, srate = ctx.sampleRate;
    const revLen   = Math.ceil(srate * revTime);
    const irBuf    = ctx.createBuffer(2, revLen, srate);
    for (let c = 0; c < 2; c++) {
      const ch = irBuf.getChannelData(c);
      for (let i = 0; i < revLen; i++) {
        ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / revLen, revDecay);
      }
    }
    const reverb = ctx.createConvolver();
    reverb.buffer = irBuf;
    reverb.normalize = true;

    const dryGain = ctx.createGain(); dryGain.gain.value = 0.75;
    const wetGain = ctx.createGain(); wetGain.gain.value = 0.25;
    const reverbIn = ctx.createGain();

    reverbIn.connect(dryGain);
    reverbIn.connect(reverb);
    reverb.connect(wetGain);

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value      = 8;
    comp.ratio.value     = 4.5;
    comp.attack.value    = 0.004;
    comp.release.value   = 0.22;

    dryGain.connect(comp);
    wetGain.connect(comp);

    const masterGain = ctx.createGain();
    masterGain.gain.value = 1;
    comp.connect(masterGain);
    masterGain.connect(ctx.destination);

    glueBus = { reverbIn, reverb, comp, masterGain };
  }

  function makePanner(li) {
    const ctx = audioCtx;
    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (panner) panner.pan.value = PANS[li];
    const out = ctx.createGain();
    if (panner) { out.connect(panner); panner.connect(glueBus.reverbIn); }
    else out.connect(glueBus.reverbIn);
    return out;
  }

  // ═══════════════════════════════════════════════════════════════════
  //  SOUND — soft marimba.
  //  Hover = one single note; after LOOP_DELAY seconds a slightly quieter,
  //  continuous flowing loop starts, with notes overlapping and timing and
  //  loudness drifting a little so it feels played, not programmed.
  //  (Other instruments can be added back to INSTRUMENTS later.)
  // ═══════════════════════════════════════════════════════════════════
  const DEFAULT_INSTRUMENT = 'marimba';
  const NOTE_VOLUME = 0.5;    // the first single note
  const LOOP_VOLUME = 0.3;    // the loop, just a little softer than the note (notes overlap, so this adds up)
  const LOOP_DELAY  = 2;      // seconds before the loop starts

  // C major pentatonic across two octaves. String i starts on SCALE[i].
  const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];

  const rnd = (a, b) => a + Math.random() * (b - a);

  // Small helper: an amplitude envelope (quick attack, natural decay)
  function env(t, v, attack, dur, holdFrac) {
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + attack);
    g.gain.exponentialRampToValueAtTime(v * (holdFrac || 0.35), t + attack + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0006, t + dur);
    return g;
  }
  function osc(type, f, t, dur) {
    const o = audioCtx.createOscillator(); o.type = type; o.frequency.value = f;
    o.start(t); o.stop(t + dur + 0.05); return o;
  }

  const INSTRUMENTS = {
    // Wooden mallet: warm and round
    marimba: { label: 'Marimba', ring: [1.2, 1.6], noteRing: 0.9,
      tone(f, v, out, t, dur) {
        const g = env(t, v, 0.006, dur);
        const gWarm = audioCtx.createGain(); gWarm.gain.value = 0.18;
        const gWood = audioCtx.createGain();
        gWood.gain.setValueAtTime(0.22, t); gWood.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(9000, f * 6);
        osc('sine', f, t, dur).connect(g);
        osc('sine', f / 2, t, dur).connect(gWarm).connect(g);
        osc('sine', f * 4, t, dur).connect(gWood).connect(g);
        g.connect(lp).connect(out);
      } },


  };

  const currentInstrument = DEFAULT_INSTRUMENT;

  function playHover(li) {
    ensureAudio();
    if (!audioReady()) return;
    clearChordTimer();
    clearTimeout(chordDelayTimerId);
    const ins = INSTRUMENTS[currentInstrument];
    ins.tone(SCALE[li], NOTE_VOLUME, makePanner(li), audioCtx.currentTime + 0.01, ins.noteRing);
    chordDelayTimerId = setTimeout(() => {
      if (hoveredLine === li) loopChord(li, 0);
    }, LOOP_DELAY * 1000);
  }

  // The loop flows continuously: the chord's notes are played one after
  // another in a gentle stream (an arpeggio), and the next chord starts
  // right as the last one is still ringing -- no gaps. Each note rings over
  // the next, timing and loudness drift a little, and the chord shape
  // changes every round.
  const SHAPES = [[0, 2, 4, 2], [0, 2, 5, 3], [-1, 1, 3, 1], [0, 3, 5, 2], [1, 2, 4, 2]];
  const NOTE_GAP = [0.3, 0.38];   // seconds between notes in the stream (min, max)

  function loopChord(li, round, startAt) {
    if (hoveredLine !== li || !audioReady()) return;
    const ins = INSTRUMENTS[currentInstrument];
    const shape = SHAPES[round % SHAPES.length];
    let t = Math.max(startAt || 0, audioCtx.currentTime + 0.03);
    shape.forEach((step, k) => {
      const idx = Math.min(SCALE.length - 1, Math.max(0, li + step));
      const accent = k === 0 ? 1.0 : rnd(0.72, 0.92);            // first note of each chord a touch stronger
      ins.tone(SCALE[idx], LOOP_VOLUME * accent, makePanner((li + k) % 5), t, rnd(ins.ring[0], ins.ring[1]));
      t += rnd(NOTE_GAP[0], NOTE_GAP[1]);
    });
    // schedule the next chord to begin exactly where this one ends
    const lead = Math.max(0, (t - audioCtx.currentTime - 0.12) * 1000);
    chordTimerId = setTimeout(() => loopChord(li, round + 1, t), lead);
  }

  function clearChordTimer() {
    if (chordTimerId) { clearTimeout(chordTimerId); chordTimerId = null; }
  }

  // ═══════════════════════════════════════════════════════════════════
  //  INTRO — the enter screen.
  //  On load, the page quietly asks the browser whether sound is already
  //  allowed. If yes (often the case in Chrome when coming back from
  //  another page of the site), the screen is skipped. If not, it fades
  //  in, and the visitor's click on it is the interaction that unlocks
  //  sound, so the very first string they hover plays.
  // ═══════════════════════════════════════════════════════════════════
  const intro = document.getElementById('intro');

  function closeIntro(instant) {
    if (!introOpen) return;
    introOpen = false;
    if (instant) { intro.remove(); return; }
    intro.classList.add('hide');
    setTimeout(() => intro.remove(), 800);
  }

  function enter(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    ensureAudio();      // this click/key press is what lets the browser play sound
    closeIntro(false);
  }

  intro.addEventListener('click', enter);
  intro.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') enter(e);
  });
  // any other key press anywhere also enters
  document.addEventListener('keydown', e => {
    if (introOpen && !e.metaKey && !e.ctrlKey && !e.altKey) enter();
  });

  try { ensureAudio(); } catch (err) { /* no Web Audio: just show the intro */ }
  setTimeout(() => {
    if (audioCtx && audioCtx.state === 'running') {
      closeIntro(true);                 // sound already allowed: skip the screen
    } else {
      intro.classList.add('show');      // needs a click: show the enter screen
      intro.focus({ preventScroll: true });
    }
  }, 120);

})();
</script>
<script>
/* Rotating title under the name. Edit the words in the HTML above
   (inside #brand-role); change INTERVAL to speed it up or slow it down. */
(function () {
  const INTERVAL = 2600; // ms each title stays
  const items = Array.from(document.querySelectorAll('#brand-role span'));
  if (items.length < 2) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let i = 0;
  setInterval(() => {
    const cur = items[i];
    i = (i + 1) % items.length;
    const next = items[i];
    cur.classList.remove('in'); cur.classList.add('out');
    next.classList.remove('out');
    // restart from below
    next.style.transition = 'none';
    next.style.transform = 'translateY(110%)';
    void next.offsetWidth;
    next.style.transition = ''; next.style.transform = '';
    next.classList.add('in');
    setTimeout(() => cur.classList.remove('out'), 650);
  }, INTERVAL);
})();
</script>
